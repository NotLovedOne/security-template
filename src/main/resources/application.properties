spring.application.name=practice

jwt.secret=${JWT_SECRET}
jwt.duration=${JWT_DURATION:7200}
jwt.refresh-duration=${JWT_REFRESH_DURATION:2592000}
#cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${POSTGRES_URL:jdbc:postgresql://localhost:5432/auth}
#spring.flyway.enabled=true

#spring.jpa.show-sql=true
#spring.jpa.properties.hibernate.format_sql=true
#spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.flyway.enabled=true

spring.datasource.username=${POSTGRES_USERNAME}
spring.datasource.password=${POSTGRES_PASSWORD}

#logging.level.root = DEBUG

# Kafka properties
spring.kafka.bootstrap-servers=localhost:29092
spring.kafka.admin.fail-fast=false
spring.kafka.consumer.group-id=handson-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spromg.kafka.consumer.listener.ack-mode=manual_immediate
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.producer.batch-size=16384
# redis
spring.data.redis.host=localhost
spring.data.redis.port=6379
